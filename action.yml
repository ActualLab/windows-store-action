name: 'Windows Store Publish'
author: 'Isaac Levin'
description: 'Upload MSIX packages to a Partner Center submission and/or commit it to certification'
inputs:
  tenant-id:
    description: 'Id of Partner Tenant'
    required: true
  client-id:
    description: 'Id of Partner App Registration'
    required: true
  client-secret:
    description: 'Secret for Partner App Registration'
    required: true
  app-id:
    description: 'Id for App in Partner Center'
    required: true
  mode:
    description: >-
      publish: create a submission, upload the packages and commit it (default).
      upload: create a submission and upload the packages, but leave it pending.
      commit: apply release notes to the pending submission and commit it.
    required: false
    default: 'publish'
  release-notes-path:
    description: 'Path to a text file whose content becomes the release notes of every listing (publish/commit modes)'
    required: false
    default: ''
  submission-id:
    description: 'commit mode: fail unless the pending submission has this id (the submission-id output of the upload run)'
    required: false
    default: ''
  expected-package:
    description: 'commit mode: fail unless a package awaiting certification has this text in its file name (e.g. App.Maui_2.17.246.0_x64.msix)'
    required: false
    default: ''
  poll-until:
    description: >-
      When polling: 'published' waits for the submission to go live (for Manual and
      Scheduled publish modes it returns at the Release stage, as before);
      'certification' returns as soon as pre-processing accepted the packages
    required: false
    default: 'published'
  delete-pending:
    description: 'Delete any pending submissions in Partner Center'
    required: false
    default: 'true'
  package-path:
    description: 'Path to MISX Package'
    required: false
    default: ''
  skip-polling:
    description: 'Skip polling the submission after committing it to Dev Center'
    required: false
    default: 'true'
  delete-packages:
    description: 'Enable deletion of one or more old packages (sorted by version)'
    required: false
    default: 'true'
  packages-keep:
    description: 'Specify number of latest packages (sorted by version) to be kept'
    required: false
    default: '0'
  update-images:
    description: 'Update Package Images'
    required: false
    default: 'false'
outputs:
  submission-id:
    description: 'Id of the submission that was created or committed'
  url:
    description: 'URL of the submission in the Partner Center dashboard'
runs:
  using: 'node20'
  main: 'dist/index.js'
branding:
  icon: 'upload-cloud'
  color: 'blue'